[package]
name = "jeera"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", features = ["json", "rustls"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
